name: Bug report
description: Report a reproducible defect in the dashboard or API
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug clearly and concretely.
      placeholder: What is broken?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps needed to reproduce the issue.
      placeholder: |
        1. Start the app with ...
        2. Import ...
        3. Open ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share relevant runtime context.
      placeholder: |
        - OS:
        - Python version:
        - Browser:
        - Commit or release:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / trace
      description: Add sanitized logs, screenshots, or stack traces if relevant.
      placeholder: Paste sanitized output here.
